name: Update Economic Data

on:
  schedule:
    # Monday to Friday at 21:00 UTC (18:00 BRT)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch quotes (PTAX)
        run: cd scripts && python fetch_moedas.py
        continue-on-error: true

      - name: Fetch Selic
        run: cd scripts && python fetch_selic.py
        continue-on-error: true

      - name: Fetch CDI
        run: cd scripts && python fetch_cdi.py
        continue-on-error: true

      - name: Fetch IPCA
        run: cd scripts && python fetch_ipca.py
        continue-on-error: true

      - name: Fetch IGP-M
        run: cd scripts && python fetch_igpm.py
        continue-on-error: true

      - name: Fetch INPC
        run: cd scripts && python fetch_inpc.py
        continue-on-error: true

      - name: Fetch savings rate
        run: cd scripts && python fetch_poupanca.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
